<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plaisirs & Saveurs" />
    
    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Plaisirs & Saveurs • Hygiène & HACCP</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased select-none min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fast PWA auto-update on every entry and background return
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              // Check immediately for new versions
              reg.update();

              // Check whenever user switches back to the app tab/PWA window
              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                  reg.update();
                }
              });

              // Interval check every 5 minutes
              setInterval(function() {
                reg.update();
              }, 5 * 60 * 1000);
            })
            .catch(function(err) {
              console.warn('[HACCP] Service Worker registration:', err);
            });
        });
      }
    </script>
  </body>
</html>
